services:
  postgres:
    image: postgres:16-alpine
    container_name: jdt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jdt_itsupport
    ports:
      - "5434:5432"
    volumes:
      - jdt_postgres_data:/var/lib/postgresql/data

volumes:
  jdt_postgres_data:
